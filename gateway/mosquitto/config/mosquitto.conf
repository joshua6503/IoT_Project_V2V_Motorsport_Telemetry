# Mosquitto 2 configuration.
# WARNING: DEVELOPMENT ONLY. Anonymous access, no TLS. Never expose this port
# outside the lab network. Production would need password_file/ACLs and TLS.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
